name: Deploy manual

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to."
        type: choice
        options: [dev, prod]
        required: true
      commit_sha:
        description: "Full commit SHA to deploy to the chosen environment."
        type: string
        required: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-apps.yml
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    with:
      environment: ${{ inputs.environment }}
      commit_sha: ${{ inputs.commit_sha }}
